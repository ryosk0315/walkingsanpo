name: fetch-wiki
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch_wiki.mjs
      - name: commit result
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/wiki_check.json data/review.html data/review.md
          git commit -m "data: update wiki_check" || echo "no changes"
          git push
